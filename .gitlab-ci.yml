stages:
  - validate
  - compile
  - whatif
  - deploy_platform
  - deploy_governance
  - deploy_observability
  - verify

.default_azure:
  image: mcr.microsoft.com/azure-cli:2.61.0
  before_script:
    - az version
    - if [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_CLIENT_SECRET" ] && [ -n "$AZURE_TENANT_ID" ]; then az login --service-principal -u "$AZURE_CLIENT_ID" -p "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID"; else echo "Skipping az login; validate/compile still work without login."; fi
    - if ! command -v jq >/dev/null 2>&1; then apk add --no-cache jq >/dev/null 2>&1 || (apt-get update >/dev/null 2>&1 && apt-get install -y jq >/dev/null 2>&1); fi

variables:
  ENVIRONMENT:
    value: "prod"
    description: "Environment folder under environments/: dev, test, or prod"

validate:bicep:
  extends: .default_azure
  stage: validate
  script:
    - bash scripts/validate.sh "$ENVIRONMENT"
  artifacts:
    when: always
    paths:
      - environments/${ENVIRONMENT}/compiled/
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

compile:environment:
  extends: .default_azure
  stage: compile
  script:
    - bash scripts/compile-env.sh "$ENVIRONMENT"
  artifacts:
    paths:
      - environments/${ENVIRONMENT}/compiled/
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH'

whatif:platform:
  extends: .default_azure
  stage: whatif
  script:
    - bash scripts/whatif.sh "$ENVIRONMENT" platform
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  when: manual

whatif:governance:
  extends: .default_azure
  stage: whatif
  script:
    - bash scripts/whatif.sh "$ENVIRONMENT" governance
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  when: manual

whatif:observability:
  extends: .default_azure
  stage: whatif
  script:
    - bash scripts/whatif.sh "$ENVIRONMENT" observability
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  when: manual

deploy:platform:
  extends: .default_azure
  stage: deploy_platform
  script:
    - bash scripts/deploy-platform.sh "$ENVIRONMENT"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  when: manual
  allow_failure: false

deploy:governance:
  extends: .default_azure
  stage: deploy_governance
  script:
    - bash scripts/deploy-governance.sh "$ENVIRONMENT"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  when: manual
  allow_failure: false

deploy:observability:
  extends: .default_azure
  stage: deploy_observability
  script:
    - bash scripts/deploy-observability.sh "$ENVIRONMENT"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  when: manual
  allow_failure: false

verify:sprint2:
  extends: .default_azure
  stage: verify
  script:
    - bash scripts/verify.sh "$ENVIRONMENT"
  rules:
    - if: '$CI_COMMIT_BRANCH'
