stages:
  - validate
  - whatif

.default_azure:
  image: mcr.microsoft.com/azure-cli:2.61.0
  before_script:
    - az version
    - if [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_CLIENT_SECRET" ] && [ -n "$AZURE_TENANT_ID" ]; then az login --service-principal -u "$AZURE_CLIENT_ID" -p "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID"; else echo "Skipping az login; validate still works without login for local bicep build."; fi
    - if ! command -v jq >/dev/null 2>&1; then apk add --no-cache jq >/dev/null 2>&1 || (apt-get update >/dev/null 2>&1 && apt-get install -y jq >/dev/null 2>&1); fi

variables:
  ENVIRONMENT:
    value: "prod"
    description: "Environment folder under environments/: dev, test, or prod"

validate:bicep:
  extends: .default_azure
  stage: validate
  script:
    - bash scripts/validate.sh "$ENVIRONMENT"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

whatif:management-group:
  extends: .default_azure
  stage: whatif
  script:
    - bash scripts/whatif.sh "$ENVIRONMENT"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  when: manual
  allow_failure: false
